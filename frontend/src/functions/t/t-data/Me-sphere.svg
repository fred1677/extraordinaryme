<?xml version="1.0" standalone="no"?>
<svg id="tao-master" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1800" height="1800" style="width: 100%; height: 100%; display: block; border-radius: 50%;">
            <defs>
                <radialGradient id="sphereOverlay" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>   
                    <stop offset="35%" stop-color="#ffffff" stop-opacity="0.0"/>  
                    <stop offset="85%" stop-color="#000000" stop-opacity="0.5"/>  
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/> 
                </radialGradient>
                
                <filter id="textDropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
                </filter>
            </defs>
            
            <path d="M50,0 A50,50 0 0,0 50,100 Z" fill="#ffffff"/>
            <path d="M50,0 A50,50 0 0,1 50,100 Z" fill="#000000"/>
            
            <circle cx="50" cy="25" r="25" fill="#ffffff"/>
            <circle cx="50" cy="75" r="25" fill="#000000"/>
            
            <!-- Inner Yin & Yang Dots -->
            <circle cx="50" cy="25" r="8" fill="#000000"/>
            <circle cx="50" cy="75" r="8" fill="#ffffff"/>
            
            <circle cx="50" cy="50" r="50" fill="url(#sphereOverlay)"/>
            <text x="50" y="50" dy="0.32em" font-family="monospace" font-size="48" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="-1" filter="url(#textDropShadow)">Me</text>
        </svg>